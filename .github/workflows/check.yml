name: workspace index diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-workspace-index-diag-${{ github.ref }}
  cancel-in-progress: false
jobs:
  workspace-index:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Outside the checkout, so the pinned source stays as it was.
      - name: Choose the diagnostic directory
        run: |
          echo "HIBI_DIAGNOSTIC_DIR=$RUNNER_TEMP/workspace-index" >> "$GITHUB_ENV"
          echo "HIBI_STAGE_LOG=$RUNNER_TEMP/workspace-index/stages.jsonl" >> "$GITHUB_ENV"
      - name: Prepare stubs and source pins
        run: node scripts/workspace-index-diagnostic.mjs prepare
      - name: Install
        run: node .github/actions/ci/install.mjs
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - name: Fresh build
        run: npm run build:app
      - name: Original workspace index file once
        id: file
        timeout-minutes: 25
        run: node scripts/workspace-index-diagnostic.mjs run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: workspace-index-${{ github.run_id }}
          path: ${{ runner.temp }}/workspace-index/
          if-no-files-found: error
          retention-days: 1
