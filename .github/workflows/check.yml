name: full huge-line file diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnose-release-huge-line-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Run the whole file once so earlier palette and harness setup stay natural.
  huge-line-reading:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install as in CI
        run: node .github/actions/ci/install.mjs
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - name: Build instrumented app
        run: npm run build:app
      - name: Run the full original table file once
        shell: bash
        env:
          CI_FILE_LIMIT_MS: '900000'
          HIBI_READING_TRACE: diag/run-1.json
        run: |
          mkdir -p diag
          printf '{"status":"trace not completed; inspect TAP"}\n' > "$HIBI_READING_TRACE"
          node --import ./tests/file-limit.mjs --test --test-reporter=tap --test-concurrency=1 tests/formatted-tables.test.mjs > diag/run-1.tap 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: huge-line-reading-${{ github.run_id }}
          path: diag/
          if-no-files-found: warn
