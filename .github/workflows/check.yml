name: split alignment diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnose-split-alignment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      CI_FILE_LIMIT_MS: '1200000'
      HIBI_RELEASE_TRACE_DIR: diag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: prepare missing stubs and source pins
        shell: bash
        run: node scripts/split-alignment-diagnostic.mjs prepare
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: install as in ci
        shell: bash
        run: node .github/actions/ci/install.mjs
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - name: build fresh diagnostic app
        shell: bash
        run: npm run build
      - name: pin native runtime dependencies and output
        id: pins
        shell: bash
        run: node scripts/split-alignment-diagnostic.mjs pins
      - name: original formatted split full file once
        id: original
        if: always() && steps.pins.outcome == 'success'
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            node --import ./tests/file-limit.mjs --test --test-reporter=tap --test-concurrency=1 \
            tests/formatted-split.test.mjs > diag/alignment.tap 2>&1
          original_exit=$?
          node scripts/split-alignment-diagnostic.mjs exit "$original_exit"
          receipt_exit=$?
          if [ "$original_exit" -ne 0 ]; then exit "$original_exit"; fi
          exit "$receipt_exit"
      - name: verify complete evidence and stable fixture pins
        if: always() && steps.pins.outcome == 'success'
        shell: bash
        run: node scripts/split-alignment-diagnostic.mjs verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: split-alignment-linux-x64-${{ github.run_id }}-${{ matrix.copy }}
          path: diag/
          if-no-files-found: error
          retention-days: 7
