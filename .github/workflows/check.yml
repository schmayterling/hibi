name: intel workspace index diagnostic
on:
  workflow_dispatch:
    inputs:
      passes:
        description: Runs of the scale file per job
        default: '3'
permissions:
  contents: read
concurrency:
  group: intel-workspace-index-diag-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  index:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, rep: 1 }
          - { os: macos-15-intel, rep: 2 }
          - { os: macos-15-intel, rep: 3 }
          - { os: macos-latest, rep: 1 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: node .github/actions/ci/install.mjs
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - name: Build
        run: npm run build:app
      - name: Scale file
        env:
          PASSES: ${{ inputs.passes }}
        run: |
          out="$RUNNER_TEMP/trace"
          mkdir -p "$out"
          { sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; uptime; } | tee "$out/machine.txt"
          for pass in $(seq 1 "$PASSES"); do
            export HIBI_INDEX_TRACE="$out/trace-$pass.jsonl"
            node --import ./tests/file-limit.mjs --test --test-reporter=tap --test-concurrency=1 tests/workspace-index-scale.test.mjs > "$out/tap-$pass.txt" 2>&1 || echo "pass $pass exit $?" >> "$out/exits.txt"
            uptime >> "$out/machine.txt"
          done
          grep -h -E '^(not )?ok|duration_ms|error:' "$out"/tap-*.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trace-${{ matrix.os }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/trace/
          retention-days: 3
