name: release four reds diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnose-release-reds-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      CI_FILE_LIMIT_MS: '1200000'
      HIBI_RELEASE_TRACE_DIR: diag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: prepare missing stubs and source pins
        shell: bash
        run: node scripts/release-reds-diagnostic.mjs prepare
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: install as in ci
        shell: bash
        run: node .github/actions/ci/install.mjs
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - name: build fresh diagnostic app
        shell: bash
        run: npm run build
      - name: pin native runtime, dependencies and output
        id: pins
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node scripts/release-reds-diagnostic.mjs pins
      - name: linux addon full file once
        if: always() && steps.pins.outcome == 'success' && matrix.platform == 'linux'
        shell: bash
        run: |
          dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            node --import ./tests/file-limit.mjs --test --test-reporter=tap --test-concurrency=1 \
            tests/addon-formatted-output.test.mjs > diag/addon.tap 2>&1
      - name: linux math full file once
        if: always() && steps.pins.outcome == 'success' && matrix.platform == 'linux'
        shell: bash
        run: |
          dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            node --import ./tests/file-limit.mjs --test --test-reporter=tap --test-concurrency=1 \
            tests/formatted-math.test.mjs > diag/math.tap 2>&1
      - name: linux links full file once
        if: always() && steps.pins.outcome == 'success' && matrix.platform == 'linux'
        shell: bash
        run: |
          dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            node --import ./tests/file-limit.mjs --test --test-reporter=tap --test-concurrency=1 \
            tests/formatted-link-controls.test.mjs > diag/link.tap 2>&1
      - name: windows heading full file once
        if: always() && steps.pins.outcome == 'success' && matrix.platform == 'win32'
        shell: bash
        run: |
          node --import ./tests/file-limit.mjs --test --test-reporter=tap --test-concurrency=1 \
            tests/formatted-block-drag-geometry.test.mjs > diag/heading.tap 2>&1
      - name: reject missing or incomplete diagnostic evidence
        if: always() && steps.pins.outcome == 'success'
        shell: bash
        run: node scripts/release-reds-diagnostic.mjs verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-reds-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}
          path: diag/
          if-no-files-found: error
          retention-days: 1
