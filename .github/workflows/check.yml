name: check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    timeout-minutes: 55
    runs-on: ubuntu-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node .github/actions/ci/install.mjs
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - run: npm run build:app
      - run: |
          x() { dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' node --test --test-concurrency=1 --test-reporter=tap "$@" || true; }
          for run in 1 2 3 4 5 6 7 8; do
            echo "::group::run $run"
            x tests/formatted-block-drag-structure.test.mjs
            x --test-name-pattern='codemirror: split panes align corresponding carets' tests/motion.test.mjs
            x --test-name-pattern='native wheel scrolling' tests/formatted-split.test.mjs
            echo "::endgroup::"
          done
