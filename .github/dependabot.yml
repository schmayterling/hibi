version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Review the Vite 8 and React plugin 6 migration separately.
      - dependency-name: vite
        versions: ['>=8']
      - dependency-name: '@vitejs/plugin-react'
        versions: ['>=6']
      # Review the Vitest 5 migration separately.
      - dependency-name: vitest
        versions: ['>=5']
      # Tiptap Mathematics supports KaTeX through 0.18.
      - dependency-name: katex
        versions: ['>=0.19']
    groups:
      development:
        patterns: ['*']
        exclude-patterns: [electron]
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/ci']
    schedule:
      interval: monthly
