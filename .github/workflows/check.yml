name: paragraph width diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed diagnostic commit
        type: string
        required: true
      expected_tree:
        description: Exact reviewed diagnostic tree
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: paragraph-width-diag-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    name: windows-paragraph204
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI_FILE_LIMIT_MS: '1200000'
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      HIBI_PARAGRAPH_TRACE: ${{ github.workspace }}/.cache/paragraph-width/widths.json
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve context before installation or build
        shell: bash
        run: python scripts/paragraph-width-evidence.py context
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install native dependencies
        shell: bash
        run: node .github/actions/ci/install.mjs
      - name: Fresh native Windows build
        shell: bash
        run: |
          test ! -e out
          npm run build
      - name: Pin source dependencies and fresh output
        shell: bash
        run: python scripts/paragraph-width-evidence.py snapshot before
      - name: One original full formatted-tables file
        shell: bash
        run: python scripts/paragraph-width-evidence.py run
      - name: Pin after original exit
        if: always()
        shell: bash
        run: python scripts/paragraph-width-evidence.py snapshot after
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: paragraph-width-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.copy }}
          path: .cache/paragraph-width/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
