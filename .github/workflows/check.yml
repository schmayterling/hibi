---
name: link crossing diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnose-link-crossing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # The release's own check: clean, full, one app at a time, the whole shard.
  checks:
    timeout-minutes: 85
    runs-on: ubuntu-24.04-arm
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Outside the checkout, so the shard sees the same tree as the release.
      - name: Choose the trace directory
        run: echo "HIBI_RELEASE_TRACE_DIR=$RUNNER_TEMP/diag" >> "$GITHUB_ENV"
      - name: Prepare stubs and source pins
        run: node scripts/link-crossing-diagnostic.mjs prepare
      - name: Full required checks
        id: ci
        timeout-minutes: 75
        uses: ./.github/actions/ci
        with:
          clean: true
          shard: 3/4
      - name: Record outcome and pins
        if: always()
        env:
          CHECKS_RESULT: ${{ steps.ci.outcome }}
        run: node scripts/link-crossing-diagnostic.mjs finish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: link-crossing-${{ github.run_id }}
          path: ${{ runner.temp }}/diag/
          if-no-files-found: error
          retention-days: 1
