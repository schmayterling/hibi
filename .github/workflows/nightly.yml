name: nightly and releases
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      clean:
        description: Ignore download caches (builds and checks always run in full)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: releases
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: release
        env:
          STABLE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/nightly.mjs prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release.json
          overwrite: true
          retention-days: 1
          if-no-files-found: error
  build:
    needs: prepare
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            args: --linux --x64
          - os: windows-latest
            platform: windows-x64
            args: --win --x64
          - os: macos-latest
            platform: macos-arm64
            args: --mac --arm64
          - os: macos-15-intel
            platform: macos-x64
            args: --mac --x64
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      electron_config_cache: ${{ github.workspace }}/.cache/electron
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: ${{ inputs.clean != true && 'npm' || '' }}
      - id: electron
        run: node -e "console.log('version=' + require('./package.json').devDependencies.electron)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.clean != true
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
      - run: npm ci
      - name: Compile application
        id: compile
        run: npm run build
      - name: Full required checks
        id: checks
        timeout-minutes: 25
        continue-on-error: ${{ needs.prepare.outputs.channel == 'nightly' }}
        run: |
          npm run lint
          npm run docs:check
          npm run copy:check
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' node --test --test-concurrency=1 tests/*.test.mjs
          else
            node --test --test-concurrency=1 tests/*.test.mjs
          fi
      - name: Install macOS signing credentials
        if: startsWith(matrix.platform, 'macos-')
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          certificate_path="$RUNNER_TEMP/hibi-signing.p12"
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          keychain_path="$RUNNER_TEMP/hibi-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)

          printf '%s' "$MAC_CSC_LINK" | base64 --decode -o "$certificate_path"
          if [[ "$APPLE_API_KEY_CONTENT" == -----BEGIN* ]]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$api_key_path"
          else
            printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode -o "$api_key_path"
          fi
          openssl pkey -in "$api_key_path" -noout
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MAC_CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          rm "$certificate_path"

          echo "CSC_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
      - name: Package installers
        id: package
        env:
          APPLE_API_KEY_ID: ${{ startsWith(matrix.platform, 'macos-') && vars.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ startsWith(matrix.platform, 'macos-') && vars.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.platform, 'macos-') && vars.APPLE_TEAM_ID || '' }}
          BUILD_ARGS: ${{ matrix.args }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          read -r -a build_args <<< "$BUILD_ARGS"
          npx electron-builder --publish never "${build_args[@]}" \
            -c.extraMetadata.version="$RELEASE_VERSION" \
            -c.buildVersion="${RELEASE_VERSION%%-*}.$GITHUB_RUN_NUMBER" \
            "-c.artifactName=hibi-\${version}-\${os}-\${arch}.\${ext}"
      - name: Verify signed macOS installers
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          app=$(find release -maxdepth 2 -type d -name 'hibi.app' -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -F "TeamIdentifier=$APPLE_TEAM_ID"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
      - name: Record platform results
        env:
          PLATFORM: ${{ matrix.platform }}
          SHA: ${{ needs.prepare.outputs.sha }}
          BUILD_RESULT: ${{ steps.compile.outcome }}
          CHECKS_RESULT: ${{ steps.checks.outcome }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const { PLATFORM, SHA, BUILD_RESULT, CHECKS_RESULT, PACKAGE_RESULT } = process.env;
            writeFileSync("release/checks-" + PLATFORM + ".json", JSON.stringify({ platform: PLATFORM, sha: SHA, build: BUILD_RESULT, checks: CHECKS_RESULT, package: PACKAGE_RESULT }));
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.platform }}
          overwrite: true
          retention-days: 1
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/checks-${{ matrix.platform }}.json
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Classify complete release
        id: classify
        run: node scripts/nightly.mjs classify
      - name: Generate verified update feeds
        run: node scripts/update-feed.mjs
      - name: Publish immutable release with commit changelog
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.classify.outputs.tag }}
          STATUS: ${{ steps.classify.outputs.status }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd installers && sha256sum ./*.exe ./*.dmg ./*.zip ./*.AppImage > SHA256SUMS.txt)
          node scripts/nightly.mjs notes > release-notes.md
          prerelease=true
          latest=false
          if [ "$STATUS" = stable ]; then
            prerelease=false
            latest=true
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo "::notice::Release $TAG already published; preserving its assets."
              exit 0
            fi
            test "$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)" = "$SHA"
          else
            gh release create "$TAG" --target "$SHA" --title "hibi $VERSION ($STATUS)" --notes-file release-notes.md --draft --prerelease="$prerelease"
          fi
          gh release upload "$TAG" installers/* release.json --clobber
          gh release edit "$TAG" --notes-file release-notes.md --draft=false --prerelease="$prerelease" --latest="$latest"
      - name: Update recommended nightly pointer
        if: steps.classify.outputs.status == 'nightly-green'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          node scripts/nightly.mjs recommend
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly-green" > recommended-ref.json 2>/dev/null; then
            previous=$(node -p 'JSON.parse(require("node:fs").readFileSync("recommended-ref.json", "utf8")).object.sha')
            if ! git merge-base --is-ancestor "$previous" "$SHA"; then
              echo "::notice::Preserving the newer recommended nightly."
              exit 0
            fi
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly-green" -f sha="$SHA" -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/nightly-green -f sha="$SHA"
          fi
          if ! gh release view nightly-green >/dev/null 2>&1; then
            gh release create nightly-green --target "$SHA" --title 'Latest recommended nightly' --notes-file recommended-notes.md --prerelease --latest=false
          fi
          gh release upload nightly-green recommended-nightly.json --clobber
          gh release upload nightly-green installers/update.json --clobber
          gh release edit nightly-green --target "$SHA" --notes-file recommended-notes.md --prerelease --latest=false
      - name: Update all-nightlies feed
        if: needs.prepare.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --target "$SHA" --title 'Latest nightly (including broken builds)' --notes 'This update channel includes builds with failed checks. Use nightly-green for the recommended nightly.' --prerelease --latest=false
          fi
          gh release upload nightly installers/update.json --clobber
      - name: Surface broken nightly checks
        if: steps.classify.outputs.status == 'nightly-broken'
        run: |
          echo '::error::Published a nightly-broken debug build. The recommended nightly was not changed.'
          exit 1
      - name: Announce nightly on Discord
        if: ${{ !cancelled() && needs.prepare.outputs.channel == 'nightly' && steps.publish.outcome == 'success' }}
        env:
          NIGHTLIES_WEBHOOK_URL: ${{ secrets.NIGHTLIES_WEBHOOK_URL }}
        run: node scripts/nightly.mjs notify
