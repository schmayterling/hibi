name: check
on:
  workflow_dispatch:
    inputs:
      clean:
        description: unused
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tab-indent:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [base, fix]
        job: [1, 2, 3, 4]
    runs-on: windows-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node .github/actions/ci/install.mjs
        shell: bash
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - if: matrix.variant == 'base'
        shell: bash
        run: git checkout 9c4da6dc1 -- src/shared/source-buffer.ts && git diff --stat HEAD
      - run: npm run build:app
        shell: bash
      - name: step timings
        shell: bash
        run: node --test --test-reporter=tap tests/zz-probe-tab.test.mjs 2>&1 | grep -E "^# rate|^not ok|^ok" || true
      - name: tab-indent x3
        shell: bash
        run: |
          status=0
          for i in 1 2 3; do
            node --import ./tests/file-limit.mjs --test --test-reporter=tap tests/tab-indent.test.mjs > run-$i.log 2>&1 || status=1
            echo "run $i: $(grep -E '^(not )?ok' run-$i.log | tr '\n' ' ')"
            grep -A3 'ok [0-9]* - one megabyte' run-$i.log | grep -E 'ok|duration_ms'
          done
          exit $status
