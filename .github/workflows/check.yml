name: check
# Diagnostic only, never merge: windows paragraph width probe copies.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Probe scenarios as JSON
        type: string
        default: '[{"name":"plain"}]'
      trace:
        description: Non-empty to trace the editor's measure passes
        type: string
        default: ''
      copies:
        description: Copies as a JSON array
        type: string
        default: '[1, 2, 3, 4, 5, 6, 7, 8]'
permissions:
  contents: read
concurrency:
  group: wpwgd-diag-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  windows:
    name: windows-wpw
    strategy:
      fail-fast: false
      matrix:
        copy: ${{ fromJSON(inputs.copies) }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      WPW_SCENARIOS: ${{ inputs.scenarios }}
      WPW_TRACE: ${{ inputs.trace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        shell: bash
        run: node .github/actions/ci/install.mjs
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - name: Build
        shell: bash
        run: npm run build
      - name: Probe
        shell: bash
        run: |
          mkdir -p .cache/wpw
          export WPW_OUT="$GITHUB_WORKSPACE/.cache/wpw/probe.jsonl"
          if [ -n "$WPW_TRACE" ]; then
            export HIBI_PARAGRAPH_TRACE="$GITHUB_WORKSPACE/.cache/wpw/widths.json"
            export WPW_TRACE_OUT="$GITHUB_WORKSPACE/.cache/wpw/trace"
          fi
          node --test --test-reporter=tap --test-concurrency=1 tests/wpw-probe.test.mjs > .cache/wpw/probe.tap 2>&1 || true
          grep -E "^(not )?ok " .cache/wpw/probe.tap || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wpw-${{ github.run_id }}-${{ matrix.copy }}
          path: .cache/wpw/
          if-no-files-found: error
          retention-days: 3
