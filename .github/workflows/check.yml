name: check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      electron_config_cache: ${{ github.workspace }}/.cache/electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node .github/actions/ci/install.mjs
        shell: bash
      - run: npm run build:app
        shell: bash
      - run: node probe/make-html-probe.mjs .
        shell: bash
      - name: pick clipboard probe
        shell: bash
        run: |
          run() { node --import ./tests/file-limit.mjs --test --test-reporter=tap --test-concurrency=1 --test-name-pattern='^cut over a native table pick' tests/zz-pick-html-probe.test.mjs; }
          if [ "$RUNNER_OS" = Linux ]; then
            export -f run
            dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' bash -c run
          else
            run
          fi
