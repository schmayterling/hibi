name: rebuild documentation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs-revision
      - docs/licenses/**
      - src/**
      - scripts/**
      - tests/addon-reference.test.mjs
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/docs-sync.yml

permissions:
  contents: read

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: request documentation build
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
          HIBI_SHA: ${{ github.sha }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({event_type: "hibi-docs-update", client_payload: {hibi_sha: process.env.HIBI_SHA}}))' |
            gh api --method POST repos/hibigarden/docs/dispatches --input -
