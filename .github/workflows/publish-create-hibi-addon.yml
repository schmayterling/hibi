name: stage create-hibi-addon

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-create-hibi-addon
  cancel-in-progress: false

jobs:
  stage:
    if: github.repository == 'schmayterling/hibi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.15.0
      - run: node --test tests/create-addon.test.mjs
      - run: npm stage publish --access public --provenance
        working-directory: packages/create-hibi-addon
