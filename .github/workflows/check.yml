name: table budget diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-table-native-budget-${{ github.ref }}
  cancel-in-progress: false
jobs:
  table-budget:
    runs-on: macos-15-intel
    timeout-minutes: 75
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Outside the checkout, so the pinned source stays as it was.
      - name: Choose the diagnostic directory
        run: echo "HIBI_DIAGNOSTIC_DIR=$RUNNER_TEMP/table-budget" >> "$GITHUB_ENV"
      - name: Prepare stubs and source pins
        run: node scripts/table-budget-diagnostic.mjs prepare
      - name: Install
        run: node .github/actions/ci/install.mjs
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - name: Fresh build
        run: npm run build:app
      - name: Original tables file, tail 2000
        timeout-minutes: 25
        run: node scripts/table-budget-diagnostic.mjs run control
      # The control is expected to run out of time; the candidate still runs on this runner.
      - name: Original tables file, tail 1000
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: node scripts/table-budget-diagnostic.mjs run candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: table-budget-${{ github.run_id }}
          path: ${{ runner.temp }}/table-budget/
          if-no-files-found: error
          retention-days: 1
