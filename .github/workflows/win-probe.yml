name: win-probe
on:
  push:
    branches: [may/win-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: node --test --test-name-pattern='interrupted check' tests/ci-plan.test.mjs
      - run: node --test --test-name-pattern='slow quit' tests/electron-harness.test.mjs
        if: always()
