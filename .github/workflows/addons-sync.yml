name: sync addons
on:
  push:
    branches: [main]
    paths: ['src/addons/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: addons-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out addon source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: source/.nvmrc
      - name: Export catalog data
        working-directory: source
        run: node scripts/export-addons.mjs
      - name: Source revision
        id: source
        working-directory: source
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check out website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hibigarden/site
          ref: main
          path: site
          token: ${{ secrets.ADDONS_SYNC_TOKEN }}
      - name: Sync catalog and preserve its route
        run: rsync -a --delete --exclude=/index.html source/out/addons/ site/addons/
      - name: Detect catalog changes
        id: changes
        working-directory: site
        run: |
          git add -- addons
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate website
        if: steps.changes.outputs.changed == 'true'
        working-directory: site
        run: |
          npm ci
          npm test
          npm run build
      - name: Publish changed catalog
        if: steps.changes.outputs.changed == 'true'
        working-directory: site
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(addons): sync to main ($SOURCE_COMMIT)"
          git push origin HEAD:main
