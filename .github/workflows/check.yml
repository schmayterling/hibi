name: check
# Never merge. One full-file Intel check of the reviewed paragraph demand change.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: table-reference-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reference-native:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Install
        run: node .github/actions/ci/install.mjs
      - name: Fresh build
        run: npm run build:app
      - name: Record pins before
        run: |
          mkdir "$RUNNER_TEMP/table-reference-native"
          test "$(shasum -a 256 tests/formatted-tables.test.mjs | cut -c1-64)" = 72fc0ee0a7690e8ef6ff64c6e2809ebb14e7212df09d453c2279784120750690
          node scripts/table-reference-native-pins.mjs "$RUNNER_TEMP/table-reference-native/pins-before.json"
      - name: Original full tables file
        id: tables
        timeout-minutes: 25
        run: |
          set +e
          node --import ./tests/file-limit.mjs --test --test-reporter=tap --test-concurrency=1 tests/formatted-tables.test.mjs > "$RUNNER_TEMP/table-reference-native/tables.tap" 2> "$RUNNER_TEMP/table-reference-native/tables.stderr"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/table-reference-native/tables.exit"
          exit "$code"
      - name: Record pins after
        if: always()
        run: |
          node scripts/table-reference-native-pins.mjs "$RUNNER_TEMP/table-reference-native/pins-after.json"
          cmp "$RUNNER_TEMP/table-reference-native/pins-before.json" "$RUNNER_TEMP/table-reference-native/pins-after.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: table-reference-native-${{ github.run_id }}
          path: ${{ runner.temp }}/table-reference-native
          retention-days: 7
          if-no-files-found: error
