appId: com.ryanaque.hibi
extends: ./scripts/file-associations.cjs
productName: hibi
directories:
  output: release
files:
  - out/**/*
  - package.json
  - LICENSE.md
asar: true
asarUnpack:
  - node_modules/@esbuild/**/*
  - node_modules/esbuild/**/*
extraResources:
  - from: build
    to: icons
    filter: ["icon-*.png"]
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/electron-third-party.html
  - from: docs/licenses
    to: licenses/colorschemes
    filter: ["*.md"]
  - from: node_modules/geist/LICENSE.txt
    to: licenses/geist.txt
npmRebuild: false
publish:
  provider: generic
  url: https://github.com/schmayterling/hibi/releases/download/nightly-green/
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
mac:
  icon: build/icon.icns
  target: [dmg, zip]
  forceCodeSigning: true
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
win:
  icon: build/icon.ico
  target: [nsis]
linux:
  icon: build/icon-linux.png
  target: [AppImage]
