name: check
# Diagnostic only, never merge: the huge paragraph width tests with and without the line gap patch.
on:
  workflow_dispatch:
    inputs:
      pattern:
        description: Test name pattern
        type: string
        default: "huge paragraph|a new width lays out"
      copies:
        description: Copies as a JSON array
        type: string
        default: '[1, 2, 3]'
permissions:
  contents: read
concurrency:
  group: wpwgd-diag2-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  desktop:
    name: ${{ matrix.os }}-${{ matrix.variant }}-${{ matrix.copy }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        variant: [base, fix]
        copy: ${{ fromJSON(inputs.copies) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      PATTERN: ${{ inputs.pattern }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Base keeps main's codemirror patches
        if: matrix.variant == 'base'
        shell: bash
        run: git checkout ef1cd13ca -- scripts/patch-codemirror-view.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        shell: bash
        run: node .github/actions/ci/install.mjs
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - name: Build
        shell: bash
        run: npm run build
      - name: Tests
        shell: bash
        run: |
          mkdir -p .cache/wpw
          git diff --stat ef1cd13ca -- scripts/patch-codemirror-view.mjs > .cache/wpw/patch.txt
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' node --test --test-reporter=tap --test-concurrency=1 "--test-name-pattern=$PATTERN" tests/formatted-tables.test.mjs > .cache/wpw/tables.tap 2>&1 || true
          else
            node --test --test-reporter=tap --test-concurrency=1 "--test-name-pattern=$PATTERN" tests/formatted-tables.test.mjs > .cache/wpw/tables.tap 2>&1 || true
          fi
          grep -E "^(not )?ok |widths" .cache/wpw/tables.tap | head -20 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wpw2-${{ github.run_id }}-${{ matrix.os }}-${{ matrix.variant }}-${{ matrix.copy }}
          path: .cache/wpw/
          if-no-files-found: error
          retention-days: 3
