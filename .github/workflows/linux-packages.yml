name: linux packages
on:
  pull_request:
    paths: &packaging
      - .github/workflows/linux-packages.yml
      - .github/workflows/nightly.yml
      - .nvmrc
      - build/**
      - electron-builder.yml
      - package-lock.json
      - package.json
      - scripts/file-associations.cjs
  push:
    branches: [main]
    paths: *packaging
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            deb: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            deb: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Flatpak packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Package installers
        env:
          ARCH: ${{ matrix.arch }}
        run: npx electron-builder --publish never --linux "--$ARCH" "-c.artifactName=hibi-\${version}-\${os}-\${arch}.\${ext}"
      - name: Inspect installers
        env:
          DEB_ARCH: ${{ matrix.deb }}
        run: |
          test "$(ls release/*.AppImage release/*.deb release/*.flatpak | wc -l)" = 3
          test "$(dpkg-deb --field release/*.deb Architecture)" = "$DEB_ARCH"
          dpkg-deb --contents release/*.deb | grep -F ./usr/share/applications/com.ryanaque.hibi.desktop
          flatpak install --user --noninteractive --bundle release/*.flatpak
          flatpak info --user com.ryanaque.hibi
      # Catch immediate startup failures: each launch must still be running after 20 seconds.
      - name: Launch installed packages
        run: |
          sudo apt-get install -y xvfb ./release/*.deb
          for command in hibi 'flatpak run com.ryanaque.hibi'; do
            status=0
            # shellcheck disable=SC2086
            timeout --kill-after=5 20 dbus-run-session -- xvfb-run --auto-servernum $command || status=$?
            test "$status" = 124
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          retention-days: 3
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.flatpak
