name: hidden source growth diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnose-hidden-growth-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      CI_FILE_LIMIT_MS: '1200000'
      HIBI_RELEASE_TRACE_DIR: diag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: prepare missing stubs and source pins
        shell: bash
        run: node scripts/hidden-growth-diagnostic.mjs prepare
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: install as in ci
        shell: bash
        run: node .github/actions/ci/install.mjs
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - name: instrument native view construction
        shell: bash
        run: node scripts/intel-view-diagnostic.mjs
      - name: build fresh diagnostic app
        shell: bash
        run: npm run build
      - name: pin native runtime dependencies and output
        id: pins
        shell: bash
        run: node scripts/hidden-growth-diagnostic.mjs pins
      - name: original hidden source full file once
        id: original
        if: always() && steps.pins.outcome == 'success'
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          node --import ./tests/file-limit.mjs --test --test-reporter=tap --test-concurrency=1 \
            tests/formatted-hidden-source.test.mjs > diag/growth.tap 2>&1
          original_exit=$?
          node scripts/hidden-growth-diagnostic.mjs exit "$original_exit"
          receipt_exit=$?
          status=$receipt_exit
          if [ "$receipt_exit" -eq 0 ]; then
            cat diag/growth.tap
            status=$?
          fi
          if [ "$original_exit" -ne 0 ]; then exit "$original_exit"; fi
          exit "$status"
      - name: verify complete evidence and stable fixture pins
        if: always() && steps.pins.outcome == 'success'
        shell: bash
        run: node scripts/hidden-growth-diagnostic.mjs verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hidden-growth-macos-x64-${{ github.run_id }}
          path: diag/
          if-no-files-found: error
          retention-days: 1
