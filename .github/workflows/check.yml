name: check
# DIAGNOSTIC ONLY (may/diagnose-garden-window-1107, never merged): one macOS
# job running the garden test with a native window geometry trace.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  garden-window:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node .github/actions/ci/install.mjs
        shell: bash
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - run: npm run build:app
        shell: bash
      - name: garden test with geometry trace
        shell: bash
        env:
          HIBI_GEO_TRACE: '1'
          HIBI_GEO_OUT: ${{ github.workspace }}/geo/garden.json
        run: |
          mkdir -p geo
          system_profiler SPDisplaysDataType > geo/displays.txt 2>&1 || true
          set -o pipefail
          node --import ./tests/file-limit.mjs --test --test-reporter=tap --test-concurrency=1 tests/addon-garden-ui.test.mjs 2>&1 | tee geo/garden.tap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: garden-geometry
          path: geo/
