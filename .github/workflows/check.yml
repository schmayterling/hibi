name: check
# Never merge: one manual run of the nightly's ubuntu-24.04-arm checks shard 2/4,
# with the dictionary file's Playwright protocol traffic logged.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  # A pull request's newest push replaces its run. Main's runs verify what pull
  # requests skip, so each finishes, and only the newest waiting push runs next.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    # Allow clean native shards to finish, with ten minutes left for reports.
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm]
        shard: [2]
        include:
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # tests/dictionary-protocol.mjs logs only into this folder, made empty here.
      - run: mkdir "$RUNNER_TEMP/dictionary-protocol"
      # No continue-on-error: a red here stays the job's red.
      - name: Full required checks
        id: ci
        timeout-minutes: 75
        uses: ./.github/actions/ci
        with:
          clean: true
          shard: ${{ matrix.shard }}/4
      - name: Record shard result
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          SHA: ${{ github.sha }}
          SHARD: ${{ matrix.shard }}
          CHECKS_RESULT: ${{ steps.ci.outcome }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const { PLATFORM, SHA, SHARD, CHECKS_RESULT } = process.env;
            writeFileSync("checks-" + PLATFORM + "-" + SHARD + ".json", JSON.stringify({ platform: PLATFORM, sha: SHA, shard: Number(SHARD), checks: CHECKS_RESULT }));
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-${{ matrix.platform }}-${{ matrix.shard }}
          path: checks-${{ matrix.platform }}-${{ matrix.shard }}.json
          overwrite: true
          retention-days: 1
          if-no-files-found: error
      # Binds the log to this one run. Any failed read, hash or write here, or
      # anything but one nonempty log of at most 64 MiB, fails this step, and a
      # missing or partial receipt leaves the run incomplete.
      - name: Record dictionary protocol receipt
        if: always()
        env:
          CHECKS_OUTCOME: ${{ steps.ci.outcome }}
          CHECKS_CONCLUSION: ${{ steps.ci.conclusion }}
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { createHash } from "node:crypto";
            import { readdirSync, readFileSync, statSync, writeFileSync } from "node:fs";
            const env = process.env;
            const folder = env.RUNNER_TEMP + "/dictionary-protocol";
            const sha256 = (path) => createHash("sha256").update(readFileSync(path)).digest("hex");
            const version = (name) => JSON.parse(readFileSync("node_modules/" + name + "/package.json", "utf8")).version;
            const files = ["package-lock.json", "scripts/ci.mjs", "tests/dictionary-protocol.mjs", "tests/dictionary-formatted.test.mjs", "node_modules/playwright-core/lib/coreBundle.js"];
            const logs = readdirSync(folder).map((name) => ({ name, bytes: statSync(folder + "/" + name).size, sha256: sha256(folder + "/" + name) }));
            const receipt = JSON.stringify({
              run: env.GITHUB_RUN_ID,
              attempt: env.GITHUB_RUN_ATTEMPT,
              workflow: env.GITHUB_WORKFLOW_REF,
              job: env.GITHUB_JOB,
              ref: env.GITHUB_REF,
              sha: env.GITHUB_SHA,
              tree: execFileSync("git", ["rev-parse", "HEAD^{tree}"], { encoding: "utf8" }).trim(),
              checks: { outcome: env.CHECKS_OUTCOME, conclusion: env.CHECKS_CONCLUSION },
              runner: { os: env.RUNNER_OS, arch: env.RUNNER_ARCH, imageOS: env.ImageOS, imageVersion: env.ImageVersion },
              node: process.version,
              playwrightCore: version("playwright-core"),
              electron: version("electron"),
              files: Object.fromEntries(files.map((file) => [file, sha256(file)])),
              logs,
              at: new Date().toISOString(),
            });
            writeFileSync(env.RUNNER_TEMP + "/dictionary-protocol-receipt.json", receipt + "\n");
            console.log("dictionary-protocol-receipt " + receipt);
            if (logs.length !== 1 || !logs[0].bytes || logs[0].bytes > 64 * 1024 * 1024) process.exit(1);
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dictionary-protocol-${{ matrix.platform }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/dictionary-protocol
            ${{ runner.temp }}/dictionary-protocol-receipt.json
          retention-days: 7
          if-no-files-found: error
