name: sync documentation

on:
  push:
    branches: [main]
    paths: ['docs/**']

permissions:
  contents: read

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source
    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: source/.nvmrc
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run docs:check
      - run: npm run export:docs
      - name: source revision
        id: revision
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: check out published documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hibigarden/docs
          ref: main
          path: published-docs
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
      - name: publish changed html
        working-directory: published-docs
        env:
          SOURCE_COMMIT: ${{ steps.revision.outputs.sha }}
        run: |
          cp ../source/out/docs/index.html index.html
          git add -- index.html
          if git diff --cached --quiet; then
            echo 'documentation html is unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: sync to main ($SOURCE_COMMIT)"
          git push origin HEAD:main
