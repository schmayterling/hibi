name: preview native evidence
# never merge: one manual original full shard0; no publication or retry.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evidence:
    name: original shard0 once
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 85
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      PREVIEW_EVIDENCE_ROOT: ${{ github.workspace }}
      CI_CLEAN: 'true'
      CI_FULL: 'false'
      CI_BASE: ''
      CI_SHARD: '0/4'
      CI_WORKERS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: prepare evidence folder
        run: |
          export PREVIEW_EVIDENCE_DIR="$RUNNER_TEMP/preview-evidence"
          printf 'PREVIEW_EVIDENCE_DIR=%s\n' "$PREVIEW_EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir "$PREVIEW_EVIDENCE_DIR"
          printf '{"complete":false,"phase":"workflow-started","run":"%s","sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$PREVIEW_EVIDENCE_DIR/envelope-partial.json"
      - name: checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: original node setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: pin checkout
        run: node scripts/preview-native-evidence.mjs init
      - name: original clean dependency setup
        run: node .github/actions/ci/install.mjs
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - name: original full shard0 once
        id: ci
        timeout-minutes: 75
        run: |
          set +e
          dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' npm run check:ci > "$PREVIEW_EVIDENCE_DIR/ci.log" 2>&1
          original_exit=$?
          node scripts/preview-native-evidence.mjs exit "$original_exit"
          record_exit=$?
          cat "$PREVIEW_EVIDENCE_DIR/ci.log"
          cat_exit=$?
          capture_exit=2
          if [ "$record_exit" -eq 0 ] && [ "$cat_exit" -eq 0 ]; then
            node scripts/preview-native-evidence.mjs capture "$original_exit"
            capture_exit=$?
          fi
          if [ "$record_exit" -ne 0 ] || [ "$cat_exit" -ne 0 ] || [ "$capture_exit" -ne 0 ]; then
            printf 'preview-evidence-stage-failed capture record=%s cat=%s complete=%s\n' "$record_exit" "$cat_exit" "$capture_exit" >&2 || true
          else
            printf 'preview-evidence-capture-complete\n'
            capture_exit=$?
            if [ "$capture_exit" -ne 0 ]; then
              printf 'preview-evidence-stage-failed capture completion output\n' >&2 || true
            fi
          fi
          if [ "$original_exit" -ne 0 ]; then exit "$original_exit"; fi
          if [ "$record_exit" -ne 0 ] || [ "$cat_exit" -ne 0 ] || [ "$capture_exit" -ne 0 ]; then exit 2; fi
      - name: record final evidence envelope
        if: always()
        run: node scripts/preview-native-evidence.mjs final
      - name: upload complete local evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: preview-native-shard0
          path: ${{ runner.temp }}/preview-evidence
          retention-days: 7
          if-no-files-found: error
