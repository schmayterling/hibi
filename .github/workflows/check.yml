name: check
run-name: source growth restore diagnostic
on:
  workflow_dispatch:
    inputs:
      clean:
        description: Compatibility with the check dispatch input
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: source-growth-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      CI_WORKERS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:app
      - name: Trace the unchanged source lifecycle file
        shell: bash
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' node --import ./scripts/diagnose-source-growth.mjs --test tests/formatted-hidden-source.test.mjs
