name: check
# DIAGNOSTIC ONLY (may/diagnose-dictionary-pack-1107, never merged): one Windows
# job running the dictionary pack test eight times with a define-path trace.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dictionary-define:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node .github/actions/ci/install.mjs
        shell: bash
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - run: npm run build:app
        shell: bash
      - name: dictionary define, eight fresh profiles
        shell: bash
        env:
          HIBI_DICT_OUT: ${{ github.workspace }}/diag
        run: |
          mkdir -p diag
          failed=0
          for run in 1 2 3 4 5 6 7 8; do
            HIBI_DICT_RUN=$run node --import ./tests/file-limit.mjs --test --test-reporter=tap --test-concurrency=1 tests/diagnose-dictionary-pack.test.mjs > "diag/run-$run.tap" 2>&1 || failed=$((failed + 1))
            echo "run $run: $(grep -E '^(not )?ok ' "diag/run-$run.tap" | tr '\n' ' ')"
          done
          echo "failed $failed of 8"
          test "$failed" = 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dictionary-define
          path: diag/
