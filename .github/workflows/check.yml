name: intel workspace index natural paired check
on:
  workflow_dispatch:
    inputs:
      base:
        description: Commit to compare against this branch
        required: true
      passes:
        description: Paired runs of the scale file per job
        default: '3'
permissions:
  contents: read
concurrency:
  group: intel-workspace-index-paired-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  index:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, rep: 1 }
          - { os: macos-15-intel, rep: 2 }
          - { os: macos-15-intel, rep: 3 }
          - { os: macos-15-intel, rep: 4 }
          - { os: macos-latest, rep: 1 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: node .github/actions/ci/install.mjs
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - name: Base checkout
        env:
          BASE: ${{ inputs.base }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/base/node_modules"
      - name: Build this branch
        run: npm run build:app
      - name: Build base
        working-directory: ${{ runner.temp }}/base
        run: npm run build:app
      - name: Paired scale file
        env:
          PASSES: ${{ inputs.passes }}
        run: |
          out="$RUNNER_TEMP/trace"
          mkdir -p "$out"
          { sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; git -C "$RUNNER_TEMP/base" rev-parse HEAD; git rev-parse HEAD; uptime; } | tee "$out/machine.txt"
          for pass in $(seq 1 "$PASSES"); do
            order="base fix"
            [ $((pass % 2)) -eq 0 ] && order="fix base"
            for side in $order; do
              dir="$GITHUB_WORKSPACE"
              [ "$side" = base ] && dir="$RUNNER_TEMP/base"
              ( cd "$dir" && HIBI_INDEX_TRACE="$out/$side-$pass.jsonl" node --import ./tests/file-limit.mjs --test --test-reporter=tap --test-concurrency=1 tests/workspace-index-scale.test.mjs > "$out/$side-tap-$pass.txt" 2>&1 ) || echo "$side pass $pass exit $?" >> "$out/exits.txt"
              echo "$side $pass $(grep -h -E '^(not )?ok|duration_ms: [0-9]{5}' "$out/$side-tap-$pass.txt" | tr '\n' ' ')" | tee -a "$out/summary.txt"
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: paired-${{ matrix.os }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/trace/
          retention-days: 3
