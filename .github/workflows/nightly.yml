name: nightly and releases
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      bump:
        description: Beta version increment
        type: choice
        options: [patch, minor]
        default: patch
      version:
        description: Exact release version (optional trailing ^ forces release despite check failures)
        type: string
        default: ''
      force_release:
        description: Release despite failed checks (installer verification still required)
        type: boolean
        default: false
      clean:
        description: Ignore download caches (builds and checks always run in full)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: releases
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: release
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
          RELEASE_VERSION: ${{ inputs.version }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: node scripts/nightly.mjs prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-release-metadata
          path: release.json
          overwrite: true
          retention-days: 1
          if-no-files-found: error
  checks:
    needs: prepare
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
        shard: [0, 1, 2, 3]
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Full required checks
        id: ci
        timeout-minutes: 25
        continue-on-error: true
        uses: ./.github/actions/ci
        with:
          clean: true
          shard: ${{ matrix.shard }}/4
      - name: Record shard result
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          SHA: ${{ needs.prepare.outputs.sha }}
          SHARD: ${{ matrix.shard }}
          CHECKS_RESULT: ${{ steps.ci.outcome }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const { PLATFORM, SHA, SHARD, CHECKS_RESULT } = process.env;
            writeFileSync("checks-" + PLATFORM + "-" + SHARD + ".json", JSON.stringify({ platform: PLATFORM, sha: SHA, shard: Number(SHARD), checks: CHECKS_RESULT }));
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-${{ matrix.platform }}-${{ matrix.shard }}
          path: checks-${{ matrix.platform }}-${{ matrix.shard }}.json
          overwrite: true
          retention-days: 1
          if-no-files-found: error
  decide:
    needs: [prepare, checks]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.decide.outputs.channel }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      checks: ${{ steps.decide.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-release-metadata
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: checks-*
          path: check-shards
          merge-multiple: true
      - name: Decide release identity from every check shard
        id: decide
        run: node scripts/nightly.mjs decide
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: release.json
          overwrite: true
          retention-days: 1
          if-no-files-found: error
  build:
    needs: [prepare, decide]
    continue-on-error: true
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            args: --linux --x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            args: --linux --arm64
          - os: windows-latest
            platform: windows-x64
            args: --win --x64
          - os: macos-latest
            platform: macos-arm64
            args: --mac --arm64
          - os: macos-15-intel
            platform: macos-x64
            args: --mac --x64
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      electron_config_cache: ${{ github.workspace }}/.cache/electron
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ inputs.clean != true && 'npm' || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
      - id: electron
        run: node -e "console.log('version=' + require('./package.json').devDependencies.electron)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.clean != true
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
      - run: node .github/actions/ci/install.mjs
      - name: Compile application
        id: compile
        run: npm run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: checks-${{ matrix.platform }}-*
          path: check-shards
          merge-multiple: true
      - name: Aggregate required checks
        id: checks
        env:
          PLATFORM: ${{ matrix.platform }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: node scripts/nightly.mjs check-shards "$PLATFORM" "$SHA" check-shards/*.json
      - name: Install Flatpak packaging tools
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Install macOS signing credentials
        if: startsWith(matrix.platform, 'macos-')
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          certificate_path="$RUNNER_TEMP/hibi-signing.p12"
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          keychain_path="$RUNNER_TEMP/hibi-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)

          printf '%s' "$MAC_CSC_LINK" | base64 --decode -o "$certificate_path"
          if [[ "$APPLE_API_KEY_CONTENT" == -----BEGIN* ]]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$api_key_path"
          else
            printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode -o "$api_key_path"
          fi
          openssl pkey -in "$api_key_path" -noout
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MAC_CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          rm "$certificate_path"

          echo "CSC_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
      - name: Package installers
        id: package
        env:
          APPLE_API_KEY_ID: ${{ startsWith(matrix.platform, 'macos-') && vars.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ startsWith(matrix.platform, 'macos-') && vars.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.platform, 'macos-') && vars.APPLE_TEAM_ID || '' }}
          BUILD_ARGS: ${{ matrix.args }}
          RELEASE_VERSION: ${{ needs.decide.outputs.version }}
        run: |
          read -r -a build_args <<< "$BUILD_ARGS"
          npx electron-builder --publish never "${build_args[@]}" \
            -c.extraMetadata.version="$RELEASE_VERSION" \
            -c.buildVersion="${RELEASE_VERSION%%-*}.$GITHUB_RUN_NUMBER" \
            "-c.artifactName=hibi-\${version}-\${os}-\${arch}.\${ext}"
      - name: Inspect Linux installers
        id: inspect-linux
        if: startsWith(matrix.platform, 'linux-')
        run: |
          shopt -s nullglob
          installers=(release/*.AppImage release/*.deb release/*.flatpak)
          test "${#installers[@]}" = 3
          test "$(dpkg-deb --field release/*.deb Architecture)" = "$(dpkg --print-architecture)"
          dpkg-deb --contents release/*.deb | grep -F ./usr/share/applications/com.ryanaque.hibi.desktop
          flatpak install --user --noninteractive --bundle release/*.flatpak
          flatpak info --user com.ryanaque.hibi
      # Catch immediate startup failures: each launch must still be running after 20 seconds.
      - name: Launch installed Linux packages
        id: launch-linux
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get install -y xvfb ./release/*.deb
          for command in hibi 'flatpak run com.ryanaque.hibi'; do
            launch_exit=0
            # shellcheck disable=SC2086
            timeout --kill-after=5 20 dbus-run-session -- xvfb-run --auto-servernum $command || launch_exit=$?
            test "$launch_exit" = 124
          done
      - name: Verify signed macOS installers
        id: verify-mac
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          app=$(find release -maxdepth 2 -type d -name 'hibi.app' -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -F "TeamIdentifier=$APPLE_TEAM_ID"
          spctl --assess --type execute --verbose=4 "$app"
          bash scripts/validate-stapled-ticket.sh "$app"
      - name: Record platform results
        id: results
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          SHA: ${{ needs.prepare.outputs.sha }}
          BUILD_RESULT: ${{ steps.compile.outcome }}
          CHECKS_RESULT: ${{ steps.checks.outputs.result }}
          EXPECTED_CHECKS: ${{ needs.decide.outputs.checks }}
          RESULT: ${{ job.status }}
          INSPECT_LINUX: ${{ steps.inspect-linux.outcome }}
          LAUNCH_LINUX: ${{ steps.launch-linux.outcome }}
          VERIFY_MAC: ${{ steps.verify-mac.outcome }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
          VERSION: ${{ needs.decide.outputs.version }}
          TAG: ${{ needs.decide.outputs.tag }}
          CHANNEL: ${{ needs.decide.outputs.channel }}
        run: |
          node --input-type=module -e '
            import { mkdirSync, writeFileSync } from "node:fs";
            const { PLATFORM, SHA, BUILD_RESULT, CHECKS_RESULT, EXPECTED_CHECKS, PACKAGE_RESULT, VERSION, TAG, CHANNEL, RESULT, INSPECT_LINUX, LAUNCH_LINUX, VERIFY_MAC } = process.env;
            const checks = CHECKS_RESULT || JSON.parse(EXPECTED_CHECKS).find(report => report.platform === PLATFORM).checks;
            const verified = PLATFORM.startsWith("macos-") ? VERIFY_MAC === "success" : PLATFORM.startsWith("linux-") ? INSPECT_LINUX === "success" && LAUNCH_LINUX === "success" : PACKAGE_RESULT === "success";
            mkdirSync("build-results", { recursive: true });
            writeFileSync("build-results/checks-" + PLATFORM + ".json", JSON.stringify({ platform: PLATFORM, sha: SHA, build: BUILD_RESULT, checks, package: PACKAGE_RESULT, verification: verified ? "success" : "failure", result: RESULT, version: VERSION, tag: TAG, channel: CHANNEL }));
          '
      - name: Select complete verified installers
        id: stage
        run: node scripts/nightly.mjs stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ success() && steps.stage.outputs.has_assets == 'true' }}
        with:
          name: installers-${{ matrix.platform }}
          overwrite: true
          retention-days: 1
          if-no-files-found: error
          path: verified-installers/*
      - name: Record final platform outcome
        if: ${{ always() && steps.results.outcome == 'success' }}
        env:
          PLATFORM: ${{ matrix.platform }}
          RESULT: ${{ job.status }}
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "build-results/checks-" + process.env.PLATFORM + ".json";
            const report = JSON.parse(readFileSync(path, "utf8"));
            report.result = process.env.RESULT;
            writeFileSync(path, JSON.stringify(report));
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.results.outcome == 'success' }}
        with:
          name: build-result-${{ matrix.platform }}
          path: build-results/*.json
          overwrite: true
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [prepare, decide, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.decide.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: checks-*
          path: check-shards
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-result-*
          path: build-results
          merge-multiple: true
      - name: Verify packages against the checked decision
        id: classify
        run: node scripts/nightly.mjs classify
      - name: Generate verified update feeds
        run: node scripts/update-feed.mjs
      - name: Publish immutable release with commit changelog
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/nightly.mjs publish
      - name: Update release channel feeds
        id: feeds
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-feed.mjs publish
      - name: Announce release on Discord
        if: steps.publish.outputs.announce == 'true' && steps.feeds.outcome == 'success'
        env:
          NIGHTLIES_WEBHOOK_URL: ${{ secrets.NIGHTLIES_WEBHOOK_URL }}
        run: node scripts/nightly.mjs notify
      - name: Report release results and failed required checks
        if: ${{ !cancelled() && steps.publish.outputs.published == 'true' }}
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            import { releaseNotes } from "./scripts/nightly.mjs";
            const release = JSON.parse(readFileSync("release.json", "utf8"));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, releaseNotes(release, process.env.GITHUB_REPOSITORY, readFileSync("installers/SHA256SUMS.txt", "utf8")));
            if (release.checks.some(report => report.checks !== "success")) {
              if (release.forceRelease) console.log("::warning::Forced release published with failed required checks. See recorded results.");
              else {
                console.error("::error::Published a nightly with failed required checks. The beta feed was preserved.");
                process.exit(1);
              }
            }
          '
