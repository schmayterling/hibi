name: hidden source linux arm64 diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnose-hidden-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  hidden-source:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: prepare diagnostic artifacts
        shell: bash
        run: |
          mkdir -p diag
          printf '{"complete":false,"missing":1,"events":[],"dropped":0,"status":"trace not completed; inspect tap and job log"}\n' > diag/run-1.json
          printf '# target not started; inspect job log\n' > diag/run-1.tap
          git rev-parse HEAD 'HEAD^{tree}' > diag/revision.txt
          git ls-files -z | xargs -0 sha256sum > diag/source.sha256
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: install as in ci
        run: node .github/actions/ci/install.mjs
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - name: build instrumented app
        run: npm run build
      - name: pin native runtime and output
        shell: bash
        run: |
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,versions:process.versions})' > diag/runtime.json
          test "$(uname -m)" = aarch64
          sha256sum package-lock.json node_modules/.package-lock.json node_modules/@codemirror/view/dist/index.js node_modules/electron/dist/electron > diag/dependencies.sha256
          find out -type f -print0 | sort -z | xargs -0 sha256sum > diag/output.sha256
      - name: run original hidden source target once
        shell: bash
        env:
          CI_FILE_LIMIT_MS: '360000'
          HIBI_HIDDEN_SOURCE_TRACE: diag/run-1.json
        run: |
          dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            node --import ./tests/file-limit.mjs --test --test-reporter=tap --test-concurrency=1 \
            --test-name-pattern='^a source view released as its note grows returns to the same line and pixel every time$' \
            tests/formatted-hidden-source.test.mjs > diag/run-1.tap 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hidden-source-linux-arm64-${{ github.run_id }}
          path: diag/
          if-no-files-found: error
