name: huge-line reading diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnose-huge-line-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Isolated original file, not the full shard; passes do not exclude shard effects.
  huge-line-reading:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install as in CI
        run: node .github/actions/ci/install.mjs
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - name: Build instrumented app
        run: npm run build:app
      - name: Up to eight fresh-profile runs; stop on first failure
        shell: bash
        env:
          CI_FILE_LIMIT_MS: '360000'
        run: |
          mkdir -p diag
          for run in 1 2 3 4 5 6 7 8; do
            export HIBI_READING_TRACE="diag/run-$run.json"
            printf '{"status":"trace not completed; inspect TAP"}\n' > "$HIBI_READING_TRACE"
            if node --import ./tests/file-limit.mjs --test --test-reporter=tap --test-concurrency=1 --test-name-pattern='^the reading place deep inside a huge line holds through second changes, shrinks and splits$' tests/formatted-tables.test.mjs > "diag/run-$run.tap" 2>&1; then
              echo "run $run passed"
            else
              diag_status=$?
              echo "run $run failed (exit $diag_status); no further runs"
              exit "$diag_status"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: huge-line-reading-${{ github.run_id }}
          path: diag/
          if-no-files-found: warn
