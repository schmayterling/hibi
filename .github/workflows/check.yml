name: check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bytes:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node .github/actions/ci/install.mjs
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - run: |
          bytes() {
            node -e 'const c=JSON.parse(require("fs").readFileSync("out/renderer/startup-bundle.json","utf8"));const by=new Map(c.map(x=>[x.file,x]));const s=new Set();const v=f=>{if(s.has(f))return;s.add(f);for(const d of by.get(f)?.imports??[])v(d)};for(const x of c)if(x.entry)v(x.file);console.log(process.argv[1],c.filter(x=>s.has(x.file)).reduce((a,x)=>a+x.bytes,0),"cap",691124+713+22+115)' "$1"
          }
          npm run build:app > /dev/null
          bytes branch
          git checkout origin/main -- src/renderer/src/linked-scroll.ts
          npm run build:app > /dev/null
          bytes main-linked-scroll
